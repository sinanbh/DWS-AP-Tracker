<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Event Drop Tracker</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1120">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Tab Navigation -->
  <nav class="nav-bar">
    <button class="nav-btn active" data-tab="tracker">🎯 Tracker</button>
    <button class="nav-btn" data-tab="calculators">🧮 Calculators</button>
  </nav>

  <main class="content-container">

    <!-- ================= TAB 1: TRACKER & HISTORY ================= -->
    <section id="tab-tracker" class="tab-pane active">
      <header class="section-header">
        <div>
          <h1>Active Drops</h1>
          <span class="status-badge">Auto-Saved</span>
        </div>
        <button id="toggle-edit-btn" class="btn-secondary" onclick="toggleEditMode()">Edit List</button>
      </header>

      <!-- Active Drop Counters -->
      <div class="list" id="tracker-list"></div>

      <!-- Add Item Input (Appears in Edit Mode) -->
      <div id="add-panel" class="add-panel" style="display: none;">
        <input type="text" id="new-item-name" class="input-text" placeholder="New drop name..." maxlength="30">
        <button class="btn-primary" onclick="addItem()">+ Add</button>
      </div>

      <!-- Action Buttons -->
      <div class="action-grid">
        <button class="btn-surface" onclick="copySummary()">📋 Copy Summary</button>
        <button class="btn-surface" onclick="triggerExport()">💾 Backup JSON</button>
        <button class="btn-surface" onclick="triggerImport()">📥 Import Backup</button>
        <button class="btn-archive" onclick="handleArchiveEvent()">📦 Save & Reset Event</button>
      </div>

      <!-- Divider -->
      <hr class="section-divider">

      <!-- Event History -->
      <section class="history-section">
        <div class="section-header">
          <div>
            <h2>Past Events History</h2>
            <span class="subtext-small">Archived event runs</span>
          </div>
          <button class="btn-danger-outline" onclick="handleClearAllHistory()">Clear All</button>
        </div>

        <div id="history-container" class="history-list"></div>
      </section>
    </section>

    <!-- ================= TAB 2: CALCULATORS ================= -->
    <section id="tab-calculators" class="tab-pane">
      <header class="section-header">
        <div>
          <h1>Calculators</h1>
          <span class="subtext-small">Event & progression tools</span>
        </div>
      </header>

      <div class="placeholder-card">
        <div class="placeholder-icon">🛠️</div>
        <h3>Calculators Coming Soon</h3>
        <p>This tab is pre-wired and ready for your point converters, power core costs, or formation formulas.</p>
      </div>
    </section>

  </main>

  <!-- ================= ICON PICKER MODAL ================= -->
  <div id="icon-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Choose Icon</h3>
        <button class="btn-close" onclick="closeIconModal()">✕</button>
      </div>
      
      <p class="modal-subtitle">Select from presets in <code>icons/items/</code></p>
      <div id="preset-icons-grid" class="modal-icon-grid"></div>

      <div class="modal-divider"><span>OR</span></div>

      <div class="modal-actions">
        <button class="btn-modal-action" onclick="triggerDeviceUpload()">📁 Upload from Device</button>
        <button class="btn-modal-action btn-modal-reset" onclick="resetToDefaultIcon()">↺ Reset to Default</button>
      </div>
    </div>
  </div>

  <!-- Hidden File Pickers -->
  <input type="file" id="icon-file-input" class="file-hidden" accept="image/*">
  <input type="file" id="backup-file-input" class="file-hidden" accept=".json">

  <!-- Logic Layers -->
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
