<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Event Drop Tracker</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --green: #22c55e;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 16px 12px 60px; min-height: 100vh; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 0 4px; }
    h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
    .status-badge { font-size: 0.75rem; color: var(--green); background: rgba(34, 197, 94, 0.15); padding: 4px 8px; border-radius: 999px; }

    .list { display: flex; flex-direction: column; gap: 10px; }

    .card {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 12px;
      gap: 10px;
    }

    /* Centered Icon Box */
    .icon-wrapper {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      overflow: hidden;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .icon-placeholder {
      font-size: 0.65rem;
      color: var(--subtext);
      text-align: center;
      padding: 2px;
    }

    .info { flex: 1; min-width: 0; }
    .name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Direct-editable total count */
    .count-input {
      background: transparent;
      border: none;
      border-bottom: 1px dashed #475569;
      color: #38bdf8;
      font-size: 1.3rem;
      font-weight: 800;
      width: 100%;
      max-width: 90px;
      padding: 2px 0;
      margin-top: 2px;
    }
    .count-input:focus {
      outline: none;
      border-bottom: 1px solid #38bdf8;
      background: rgba(56, 189, 248, 0.08);
    }

    /* Stepper: [-] [ editable step ] [+] */
    .stepper {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .step-btn {
      width: 40px;
      height: 42px;
      border: none;
      font-size: 1.3rem;
      font-weight: bold;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn-sub { background: #334155; }
    .btn-sub:active { background: #475569; }

    .btn-add { background: var(--accent); }
    .btn-add:active { background: var(--accent-hover); }

    .step-val {
      width: 44px;
      height: 42px;
      border: none;
      background: transparent;
      color: #f8fafc;
      text-align: center;
      font-size: 1rem;
      font-weight: 700;
      -moz-appearance: textfield;
    }
    .step-val::-webkit-inner-spin-button,
    .step-val::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .step-val:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.05);
    }

    .actions { margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-action {
      padding: 12px;
      font-size: 0.85rem;
      border-radius: 8px;
      font-weight: 600;
      color: #cbd5e1;
      background: #1e293b;
      border: 1px solid var(--card-border);
      cursor: pointer;
    }
    .btn-reset { color: #f87171; border-color: rgba(239, 68, 68, 0.3); }
    .file-input { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>Event Drop Tracker</h1>
    <span class="status-badge">Auto-Saved</span>
  </header>

  <div class="list" id="tracker-list"></div>

  <div class="actions">
    <button class="btn-action" onclick="copySummary()">📋 Copy Summary</button>
    <button class="btn-action btn-reset" onclick="resetAll()">⚠️️ Reset Event</button>
  </div>

  <input type="file" id="file-picker" class="file-input" accept="image/*">

  <script>
    const ITEMS = [
      { id: 'power_core', name: 'Power Core' },
      { id: 'dx_blueprints', name: 'DX Blueprints' },
      { id: 'precision_parts', name: 'Precision Parts' },
      { id: 'weapon_fragments', name: 'Weapon Fragments' },
      { id: 'titanium_alloys', name: 'Titanium Alloys' },
      { id: 'hero_shards', name: 'Hero Shards' }
    ];

    let counts = JSON.parse(localStorage.getItem('loot_counts') || '{}');
    let icons = JSON.parse(localStorage.getItem('loot_icons') || '{}');
    let steps = JSON.parse(localStorage.getItem('loot_steps') || '{}');
    let activeUploadId = null;

    function saveState() {
      localStorage.setItem('loot_counts', JSON.stringify(counts));
      localStorage.setItem('loot_icons', JSON.stringify(icons));
      localStorage.setItem('loot_steps', JSON.stringify(steps));
    }

    function triggerHaptic() {
      if (navigator.vibrate) navigator.vibrate(20);
    }

    function modify(id, direction) {
      const stepInput = document.getElementById(`step-${id}`);
      let stepAmount = parseInt(stepInput.value, 10);
      if (isNaN(stepAmount) || stepAmount < 1) stepAmount = 1;

      counts[id] = Math.max(0, (counts[id] || 0) + (direction * stepAmount));
      saveState();
      triggerHaptic();

      document.getElementById(`count-${id}`).value = counts[id];
    }

    function setCountDirectly(id, val) {
      let parsed = parseInt(val, 10);
      if (isNaN(parsed) || parsed < 0) parsed = 0;
      counts[id] = parsed;
      saveState();
      document.getElementById(`count-${id}`).value = parsed;
    }

    function updateStep(id, val) {
      let parsed = parseInt(val, 10);
      if (isNaN(parsed) || parsed < 1) parsed = 1;
      steps[id] = parsed;
      saveState();
    }

    function promptIconUpload(id) {
      activeUploadId = id;
      const fileInput = document.getElementById('file-picker');
      fileInput.value = '';
      fileInput.click();
    }

    document.getElementById('file-picker').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file || !activeUploadId) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        icons[activeUploadId] = event.target.result;
        saveState();
        render();
      };
      reader.readAsDataURL(file);
    });

    function resetAll() {
      if (confirm("Reset all counts to 0? Your uploaded icons will remain.")) {
        ITEMS.forEach(item => counts[item.id] = 0);
        saveState();
        render();
      }
    }

    function copySummary() {
      const text = ITEMS.map(item => `${item.name}: ${counts[item.id] || 0}`).join('\n');
      navigator.clipboard.writeText(text).then(() => {
        alert("Summary copied to clipboard!\n\n" + text);
      });
    }

    function render() {
      const list = document.getElementById('tracker-list');
      list.innerHTML = '';

      ITEMS.forEach(item => {
        const count = counts[item.id] || 0;
        const step = steps[item.id] || 1;
        const iconData = icons[item.id];

        const card = document.createElement('div');
        card.className = 'card';

        const iconHtml = iconData
          ? `<img src="${iconData}" alt="${item.name}">`
          : `<div class="icon-placeholder">Tap to upload</div>`;

        card.innerHTML = `
          <div class="icon-wrapper" onclick="promptIconUpload('${item.id}')" title="Tap to change icon">
            ${iconHtml}
          </div>
          <div class="info">
            <div class="name">${item.name}</div>
            <input type="number" inputmode="numeric" class="count-input" id="count-${item.id}" 
                   value="${count}" onchange="setCountDirectly('${item.id}', this.value)" title="Tap to edit total">
          </div>
          <div class="stepper">
            <button class="step-btn btn-sub" onclick="modify('${item.id}', -1)">−</button>
            <input type="number" inputmode="numeric" class="step-val" id="step-${item.id}" 
                   value="${step}" onchange="updateStep('${item.id}', this.value)" title="Step amount">
            <button class="step-btn btn-add" onclick="modify('${item.id}', 1)">+</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    render();
  </script>
</body>
</html>
